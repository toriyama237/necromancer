name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Package
        run: |
          mkdir -p dist
          for bin in seance-proxy necro-server necro-mcp necro-cli haunted-bank-api; do
            [ -f "target/release/$bin" ] && cp "target/release/$bin" dist/
          done
          [ -f target/release/libtime_freezer.so ] && cp target/release/libtime_freezer.so dist/
          tar -czf "necromancer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Necromancer $GITHUB_REF_NAME" \
            --generate-notes \
            "necromancer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
