version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["type: build", "dependencies"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["type: ci", "dependencies"]
