# Demo stack. Services marked TODO are filled in by their specs.
name: necromancer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: haunted_bank
    volumes:
      - ../haunted-bank/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

